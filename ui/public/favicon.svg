<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cupcake brand mark: pink cupcake (frosting swirl, cherry, striped liner).
       Literal colors because img and favicon contexts cannot read CSS tokens; they match
       the dark-pink theme accent family. SMIL, not CSS: Chromium and Safari only run
       declarative SMIL inside img-loaded SVGs (gentle float 4s, cherry glint 3s). -->
  <g>
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0 0; 0 -4; 0 0" keyTimes="0; 0.5; 1" dur="4s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
    <path d="M30 66h60l-8 38a6 6 0 0 1-5.9 5H43.9a6 6 0 0 1-5.9-5Z" fill="#c2185b"/>
    <path d="M44 66l3 43M60 66v43M76 66l-3 43" stroke="#ff6b9d" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M24 64c0-9 7-15 15-15 1-12 10-20 21-20s20 8 21 20c8 0 15 6 15 15 0 3-2 5-5 5H29c-3 0-5-2-5-5Z" fill="#ff6b9d"/>
    <path d="M38 55c6 4 14 5 22 5s16-1 22-5" stroke="#ffc2dd" stroke-width="4" stroke-linecap="round"/>
    <path d="M47 40c4 3 8 4 13 4s9-1 13-4" stroke="#ffc2dd" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="22" r="9" fill="#e0115f"/>
    <path d="M60 13c2-5 6-8 11-9" stroke="#7a0f3a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="57" cy="19" r="2.5" fill="#ffc2dd">
      <animate attributeName="opacity" values="1; 1; 0.3; 1" keyTimes="0; 0.9; 0.95; 1" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
